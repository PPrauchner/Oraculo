[project]
name = "oraculo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=26.0",
    "plotly>=6.6.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0.0",
]

# O projeto é virtual: core/, utils/ e pages/ nunca são instalados no venv.
# Sem isto a coleta falha com "No module named 'core'".
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"

# `requests` e `plotly` não publicam tipos. O aviso é sobre a biblioteca, não
# sobre o nosso código, e afogaria o sinal que a ADR-0011 quer ver: a chave
# escrita errada durante a migração da ADR-0008.
[[tool.mypy.overrides]]
module = ["requests.*", "plotly.*", "plotly.express.*"]
ignore_missing_imports = true
