[project]
name = "oraculo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=26.0",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "requests>=2.33.0",
    "streamlit>=1.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# O projeto é virtual: core/, utils/ e pages/ nunca são instalados no venv.
# Sem isto a coleta falha com "No module named 'core'".
[tool.pytest.ini_options]
pythonpath = ["."]
